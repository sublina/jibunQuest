      const newBtn = document.createElement("button");
      newBtn.className = "rpg-command-btn start-cmd";
      newBtn.textContent = "はじめから";
      newBtn.onclick = () => {
        sfx.select();
        if (hasData) {
          // starting over erases everything: ask twice
          showYesNo(
            "「はじめから」をえらぶと、\nこれまでのデータが\nすべて消えてしまいます。\n\n本当に消しますか？",
            () => {
              sfx.select();
              showYesNo(
                "もう一度おたずねします。\n\n本当の本当に\n初期化しますか？\n（元には戻せません）",
                () => { wipeAllData(); showForm(); },
                () => { sfx.select(); showMenu(); },
                { yesLabel: "削除", noLabel: "キャンセル", danger: true }   // the last step is clearly worded, in red
              );
            },
            () => { sfx.select(); showMenu(); }
          );
        } else {
          showForm();
        }
      };
      const contBtn = document.createElement("button");
      contBtn.className = "rpg-command-btn start-cmd";
      contBtn.textContent = "つづきから";
      if (hasData) {
        contBtn.onclick = () => {
          sfx.start();
          overlay.remove();
          renderLifeView();
        };
      } else {
        contBtn.disabled = true;
      }
      win.appendChild(newBtn);
      win.appendChild(contBtn);
      if (!hasData) {
        const note = document.createElement("div");
        note.className = "start-menu-note";
        note.textContent = "セーブデータが ありません";
        win.appendChild(note);
      }
      slot.appendChild(win);
    }

    // delete every saved thing and start from a clean state
    function wipeAllData() {
      try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
      state = loadState();
    }

    function showYesNo(text, onYes, onNo, opts) {
      opts = opts || {};
      overlay.onclick = null;
      overlay.innerHTML = "";
      const win = document.createElement("div");
      win.className = "rpg-screen start-window start-message";
      const msg = document.createElement("div");
      msg.className = "start-msg";
      msg.textContent = text;
      const row = document.createElement("div");
      row.className = "save-confirm-row";
      const yes = document.createElement("button");
      yes.className = "levelup-ok save-yes" + (opts.danger ? " start-danger" : "");
      yes.textContent = opts.yesLabel || "はい";
      yes.onclick = onYes;
      const no = document.createElement("button");
      no.className = "save-no";
      no.textContent = opts.noLabel || "いいえ";
      no.onclick = onNo;
      row.appendChild(yes);
      row.appendChild(no);
      win.appendChild(msg);
      win.appendChild(row);
      overlay.appendChild(win);
    }

    function showMessage(text, onOk) {
      overlay.onclick = null;
      overlay.innerHTML = "";
      const win = document.createElement("div");
      win.className = "rpg-screen start-window start-message";
      const msg = document.createElement("div");
      msg.className = "start-msg";
      msg.textContent = text;
      const ok = document.createElement("button");
      ok.className = "levelup-ok";
      ok.textContent = "OK";
      ok.onclick = onOk;
      win.appendChild(msg);
      win.appendChild(ok);
      overlay.appendChild(win);
    }

    function showForm() {
      overlay.onclick = null;
      overlay.innerHTML = "";
      const win = document.createElement("div");
      win.className = "rpg-screen start-window";

      const q1 = document.createElement("div");
      q1.className = "start-q";
      q1.textContent = "なまえを おしえてください";
      const nameInput = document.createElement("input");
      nameInput.type = "text";
      nameInput.className = "start-input";
      nameInput.maxLength = 10;
      nameInput.placeholder = DEFAULT_PLAYER_NAME;
      nameInput.value = state.playerName || "";

      const q2 = document.createElement("div");
      q2.className = "start-q";
      q2.textContent = "うまれた ひを おしえてください";
      const birthInput = document.createElement("input");
      birthInput.type = "date";
      birthInput.className = "start-input";
      if (state.birthDate) birthInput.value = state.birthDate;

      const err = document.createElement("div");
      err.className = "start-error";

      const go = document.createElement("button");
      go.className = "start-go";
      go.textContent = "START";
      go.onclick = () => {
        if (!birthInput.value) {
          err.textContent = "うまれた ひを いれてください";
          return;
        }
        state.playerName = nameInput.value.trim();
        state.birthDate = birthInput.value;
        state.setupDone = true;
        syncLevelMarkers();
        saveState();
        sfx.start();
        overlay.remove();
        renderLifeView();
      };

      const skip = document.createElement("button");
      skip.className = "start-skip";
      skip.textContent = "あとで せっていする";
      skip.onclick = () => {
        state.setupDone = true;
        saveState();
        overlay.remove();
        renderLifeView();
      };

      win.appendChild(q1);
      win.appendChild(nameInput);
      win.appendChild(q2);
      win.appendChild(birthInput);
      win.appendChild(err);
      win.appendChild(go);
      win.appendChild(skip);
      overlay.appendChild(win);
    }

    showTitle();
  }

  // ON / OFF switch for the sound effects (saved immediately)
  function buildSoundToggle() {
    const toggle = document.createElement("div");
    toggle.className = "planner-mode-toggle";
    const onBtn = document.createElement("button");
    onBtn.className = "planner-mode-btn";
    onBtn.textContent = "ON";
    const offBtn = document.createElement("button");
    offBtn.className = "planner-mode-btn";
    offBtn.textContent = "OFF";
    const refresh = () => {
      onBtn.classList.toggle("active", state.soundOn !== false);
      offBtn.classList.toggle("active", state.soundOn === false);
    };
    onBtn.onclick = () => { state.soundOn = true; saveState(); refresh(); };
    offBtn.onclick = () => { state.soundOn = false; saveState(); refresh(); };
    refresh();
    toggle.appendChild(onBtn);
    toggle.appendChild(offBtn);
    return toggle;
  }

  // ==================================================================
  // SAVE: ask first; on はい write the data to this browser, then go to the title screen
  // ==================================================================
  function confirmSave() {
    if (document.getElementById("saveConfirmOverlay")) return;
    const overlay = document.createElement("div");
    overlay.className = "levelup-overlay";
    overlay.id = "saveConfirmOverlay";
    const win = document.createElement("div");
    win.className = "rpg-screen levelup-window";

    const title = document.createElement("div");
    title.className = "save-title";
    title.textContent = "セーブ";
    const ask = document.createElement("div");
    ask.className = "save-ask";
    ask.textContent = "セーブしますか？";

    const row = document.createElement("div");
    row.className = "save-confirm-row";
    const yes = document.createElement("button");
    yes.className = "levelup-ok save-yes";
    yes.textContent = "はい";
    yes.onclick = () => { overlay.remove(); doSave(); };
    const no = document.createElement("button");
    no.className = "save-no";
    no.textContent = "いいえ";
    no.onclick = () => overlay.remove();
    row.appendChild(yes);
    row.appendChild(no);

    win.appendChild(title);
    win.appendChild(ask);
    win.appendChild(row);
    overlay.appendChild(win);
    document.body.appendChild(overlay);
  }

  function doSave() {
    let ok = true;
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
      ok = false;
    }
    if (!ok) {
      showSaveError();
      return;
    }
    sfx.save();
    openStartScreen();
  }

  function showSaveError() {
    if (document.getElementById("saveOverlay")) return;
    const overlay = document.createElement("div");
    overlay.className = "levelup-overlay";
    overlay.id = "saveOverlay";
    const win = document.createElement("div");
    win.className = "rpg-screen levelup-window";

    const title = document.createElement("div");
    title.className = "save-title";
    title.textContent = "セーブ エラー";
    const msg = document.createElement("div");
    msg.className = "levelup-msg";
    msg.textContent = "セーブに しっぱいしました…";
    const note = document.createElement("div");
    note.className = "save-note";
    note.textContent = "ブラウザの ほぞんが きんしされている かもしれません。SETTINGS の バックアップで ファイルに かきだしてください。";
    const okBtn = document.createElement("button");
    okBtn.className = "levelup-ok";
    okBtn.textContent = "OK";
    okBtn.onclick = () => overlay.remove();

    win.appendChild(title);
    win.appendChild(msg);
    win.appendChild(note);
    win.appendChild(okBtn);
    overlay.appendChild(win);
    document.body.appendChild(overlay);
    sfx.warn();
  }

  function renderAll() {
    renderTabs();
    renderChart();
  }

  renderAll();
  switchView("life");
  if (!state.setupDone) openStartScreen();
  setInterval(() => {
    renderChart();
    if (currentView === "week") renderWeekGrid();
    if (currentView === "life") renderLifeView();
  }, 15000);
})();
</script>
</body>
</html>
